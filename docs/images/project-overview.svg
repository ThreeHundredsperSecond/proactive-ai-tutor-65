<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Как части проекта связаны между собой</title>
  <desc id="desc">Материалы ЕГЭ формируют предметную модель. Цикл тьютора: наблюдение, диагностика, модель ученика, выбор действия, новая попытка. Цель — последовательное освоение методов.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53647a"/></marker>
  </defs>
  <rect width="1000" height="900" rx="20" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="50" y="25" width="900" height="100" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="500" y="65" font-size="25" font-weight="bold" fill="#253467">ЕГЭ + учебные материалы</text>
    <text x="500" y="100" font-size="20" fill="#42516b">Задачи, пошаговые решения, объяснения, требования экзамена</text>
    <path d="M500 128 V153" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="50" y="165" width="900" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="500" y="205" font-size="25" font-weight="bold" fill="#1e4674">Предметная модель</text>
    <text x="500" y="240" font-size="20" fill="#42516b">Атомарные навыки (KC) → методы → зависимости → задания</text>
    <path d="M500 268 V296" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="50" y="308" width="900" height="405" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="500" y="345" font-size="25" font-weight="bold" fill="#243247">Рабочий цикл тьютора</text>

    <rect x="130" y="370" width="320" height="110" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="290" y="413" font-size="23" font-weight="bold" fill="#243247">1. Наблюдение</text>
    <text x="290" y="450" font-size="19" fill="#42516b">Ответ или шаг ученика</text>

    <rect x="550" y="370" width="320" height="110" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="710" y="413" font-size="23" font-weight="bold" fill="#243247">2. Диагностика</text>
    <text x="710" y="450" font-size="19" fill="#42516b">Правильность, ошибка, KC</text>

    <rect x="550" y="540" width="320" height="110" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="710" y="583" font-size="23" font-weight="bold" fill="#243247">3. Модель ученика</text>
    <text x="710" y="620" font-size="19" fill="#42516b">История и освоение навыков</text>

    <rect x="130" y="540" width="320" height="110" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="290" y="583" font-size="23" font-weight="bold" fill="#243247">4. Выбор действия</text>
    <text x="290" y="620" font-size="19" fill="#42516b">Подсказка, вопрос, задача</text>

    <g fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M455 425 H540"/>
      <path d="M710 485 V530"/>
      <path d="M545 595 H460"/>
      <path d="M290 535 V490"/>
    </g>
    <text x="500" y="692" font-size="19" fill="#42516b">Действие тьютора → новый ответ ученика → повторение цикла</text>
    <path d="M500 716 V748" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="50" y="760" width="900" height="110" rx="16" fill="#ecfdf5" stroke="#a7dfc6"/>
    <text x="500" y="802" font-size="25" font-weight="bold" fill="#195e46">Результат</text>
    <text x="500" y="839" font-size="20" fill="#30584a">Последовательное освоение методов, а не просто правильные ответы</text>
  </g>
</svg>
